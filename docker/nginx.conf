server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # JWT Bearer token'ı tüm izin listesini içerdiğinde büyüyebilir.
    # Varsayılan 8KB header buffer yüzlerce perm claim'ı taşıyamaz.
    large_client_header_buffers 8 64k;
    client_header_buffer_size   32k;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # API proxy — /api/* isteklerini backend container'a ilet
    location /api/ {
        proxy_pass http://aynesil-api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Hashed Vite assets — never fall back to index.html (that breaks ES modules in Safari)
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        types {
            text/css css;
            application/javascript js mjs;
            application/wasm wasm;
            font/woff2 woff2;
            font/woff woff;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/x-icon ico;
        }
        default_type application/octet-stream;
    }

    # No cache for index.html (always latest hashed asset references)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback — non-file routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
