---
# AyNesil Platform — Docker Compose
# Tek sunuculu kurulum (üretim varsayılanları) ve yerel geliştirme.
#   Üretim : docker compose up -d --build
#   Geliştirme (DB/Redis/API portları dışarı açık):
#            docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#            (ya da: python3 devops/run_local.py)
# Ayarlar .env'den gelir (bkz. .env.example). API servisi .env'i env_file ile de okur:
# .env'e yazılan her AYNESIL_ değişkeni API'ye ulaşır.
#
# Ağ güvenliği: PostgreSQL ve Redis hiçbir porta yayınlanmaz (yalnızca iç ağ). API ve ön yüz
# yalnızca 127.0.0.1'e yayınlanır; dışarıya sunucudaki ters vekil (nginx/Caddy, TLS) açılır.
# Docker kendi iptables kurallarını yazdığı için ufw yayınlanan portları ENGELLEMEZ; bu yüzden
# kapatma burada, yayın adresiyle yapılır.

name: aynesil

services:
  # ── PostgreSQL 17 ─────────────────────────────────────────────────────────
  aynesil-db:
    image: postgres:17-alpine
    container_name: aynesil-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aynesil}
      POSTGRES_USER: ${POSTGRES_USER:-aynesil_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_owner}
      AYNESIL_DB_APP_USER: ${AYNESIL_DB_APP_USER:-aynesil_app}
      AYNESIL_DB_APP_PASSWORD: ${AYNESIL_DB_APP_PASSWORD:-changeme_app}
    volumes:
      - aynesil-db-data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    # Port yayını yok: API, Flyway ve betikler (docker exec) iç ağdan erişir.
    # Yerel geliştirme için docker-compose.dev.yml 5432'yi açar.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aynesil_owner} -d ${POSTGRES_DB:-aynesil}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aynesil-net

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  aynesil-redis:
    image: redis:7-alpine
    container_name: aynesil-redis
    restart: unless-stopped
    environment:
      # Şifre .env'den (AYNESIL_REDIS_PASSWORD). REDISCLI_AUTH sayesinde konteyner içindeki
      # redis-cli (healthcheck, `docker exec aynesil-redis redis-cli ...`) şifreyi kendiliğinden kullanır.
      REDIS_PASSWORD: ${AYNESIL_REDIS_PASSWORD:-changeme_redis}
      REDISCLI_AUTH: ${AYNESIL_REDIS_PASSWORD:-changeme_redis}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy allkeys-lru"]
    volumes:
      - aynesil-redis-data:/data
    # Port yayını yok (yalnızca iç ağ). Yerel geliştirme için docker-compose.dev.yml 6379'u açar.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - aynesil-net

  # ── Flyway — Migration runner (one-shot: V1 DDL + V2 seed, then exits) ──────
  # Çalışma sırası: aynesil-db healthy → flyway migrate → API başlar
  # History: public.flyway_schema_history (aynesil_owner'a ait, aynesil_app okuyabilir)
  # İkinci kez çalıştırma: checksum doğrulaması yapar, değişiklik yoksa "no-op"
  # Yeni migration: db/migrations/V3__*.sql ekle → docker compose run aynesil-flyway
  aynesil-flyway:
    image: flyway/flyway:10.20-alpine
    platform: linux/amd64   # alpine sadece amd64; Rosetta 2 ile çalışır (uyarı normal)
    container_name: aynesil-flyway
    depends_on:
      aynesil-db:
        condition: service_healthy
    environment:
      # Bağlantı (owner rolü — RLS bypass, DDL + seed uygular)
      FLYWAY_URL: jdbc:postgresql://aynesil-db:5432/${POSTGRES_DB:-aynesil}
      FLYWAY_USER: ${POSTGRES_USER:-aynesil_owner}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-changeme_owner}
      # Custom placeholder: afterMigrate callback'inde kullanılır
      FLYWAY_PLACEHOLDERS_APPROLE: ${AYNESIL_DB_APP_USER:-aynesil_app}
      # Bağlantı retry (container startup race condition önleme)
      FLYWAY_CONNECT_RETRIES: "15"
      FLYWAY_CONNECT_RETRIES_INTERVAL: "3"
    volumes:
      - ./db/migrations:/flyway/sql:ro
      - ./docker/flyway.conf:/flyway/conf/flyway.conf:ro
    command: migrate
    restart: "no"
    networks:
      - aynesil-net

  # ── API ───────────────────────────────────────────────────────────────────
  aynesil-api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: aynesil-api
    restart: unless-stopped
    depends_on:
      aynesil-db:
        condition: service_healthy
      aynesil-redis:
        condition: service_healthy
      aynesil-flyway:
        condition: service_completed_successfully
    # .env'deki her AYNESIL_ değişkeni API'ye ulaşır (ForwardedHeaders, CORS, token süreleri, log seviyesi…);
    # override dosyası gerekmez. Aşağıdaki environment bloğu env_file'dan önceliklidir; bu yüzden oradaki
    # değerler ${AD:-varsayılan} biçimindedir ve .env'deki aynı adlı değişkenle değiştirilebilir.
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      AYNESIL_ConnectionStrings__DefaultConnection: >-
        Host=aynesil-db;Port=5432;Database=${POSTGRES_DB:-aynesil};
        Username=${AYNESIL_DB_APP_USER:-aynesil_app};
        Password=${AYNESIL_DB_APP_PASSWORD:-changeme_app};
        Application Name=AynesilApi
      AYNESIL_ConnectionStrings__Redis: aynesil-redis:6379,password=${AYNESIL_REDIS_PASSWORD:-changeme_redis},abortConnect=false
      AYNESIL_Jwt__Secret: ${AYNESIL_Jwt__Secret:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_64_CHARACTERS}
      AYNESIL_Jwt__Issuer: ${AYNESIL_Jwt__Issuer:-https://api.aynesil.com}
      AYNESIL_Jwt__Audience: ${AYNESIL_Jwt__Audience:-aynesil-web}
      AYNESIL_Cors__AllowedOrigins__0: ${AYNESIL_Cors__AllowedOrigins__0:-http://localhost:${FRONTEND_PORT:-5173}}
      AYNESIL_Storage__Local__RootPath: /app/uploads
      # Gerçek istemci IP'si: X-Forwarded-For yalnızca compose iç ağından (ön yüz nginx'i, sunucudaki ters
      # vekilin Docker ağ geçidi üzerinden gelen bağlantısı) kabul edilir; dışarıdan gelen sahte başlık yok sayılır.
      # Ek vekiller .env'de AYNESIL_ForwardedHeaders__KnownProxies__0 / KnownNetworks__1 ile verilir.
      AYNESIL_ForwardedHeaders__KnownNetworks__0: ${AYNESIL_ForwardedHeaders__KnownNetworks__0:-${AYNESIL_NETWORK_SUBNET:-172.30.0.0/24}}
    volumes:
      - aynesil-uploads:/app/uploads
      - aynesil-logs:/app/logs
    # Yalnızca sunucunun kendisinden (ters vekil, izleme, betikler): dışarıya açık değil.
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    healthcheck:
      # curl Alpine'da yok → wget kullanılır
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - aynesil-net

  # ── Frontend ──────────────────────────────────────────────────────────────
  aynesil-web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # Relative path: browser → nginx → proxy → aynesil-api:5000
        # Absolute URL kullansaydık (http://localhost:5001), nginx bypass edilirdi.
        VITE_API_BASE_URL: /api
    container_name: aynesil-web
    restart: unless-stopped
    depends_on:
      aynesil-api:
        condition: service_healthy
    environment:
      # nginx X-Forwarded-For'u yalnızca bu ağdan (sunucudaki ters vekil → Docker ağ geçidi) gelirse dikkate alır
      # (docker/nginx.conf.template, set_real_ip_from).
      AYNESIL_NETWORK_SUBNET: ${AYNESIL_NETWORK_SUBNET:-172.30.0.0/24}
    # Varsayılan yalnızca 127.0.0.1: önüne TLS sonlandıran ters vekil konur (KURULUM_KILAVUZU A.6).
    # Ters vekilsiz doğrudan yayın gerekiyorsa .env'de FRONTEND_BIND=0.0.0.0.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    networks:
      - aynesil-net

networks:
  aynesil-net:
    driver: bridge
    # Sabit alt ağ: API ve ön yüz nginx'i bu ağı güvenilir vekil kabul eder. Sunucuda çakışırsa .env'de
    # AYNESIL_NETWORK_SUBNET ile değiştirin (değişiklik için: docker compose down && docker compose up -d).
    ipam:
      config:
        - subnet: ${AYNESIL_NETWORK_SUBNET:-172.30.0.0/24}

volumes:
  aynesil-db-data:
  aynesil-redis-data:
  aynesil-uploads:
  aynesil-logs:
