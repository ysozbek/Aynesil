# AyNesil — yerel geliştirme eki. ÜRETİMDE KULLANMAYIN.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   (python3 devops/run_local.py bu iki dosyayla başlatır)
#
# docker-compose.yml üretim için portları kapatır. Bu dosya, API'yi `dotnet run` ile ya da
# veritabanını bir masaüstü istemcisiyle kullanmak için PostgreSQL ve Redis'i, ayrıca API'yi ve
# ön yüzü ana makinenin tüm arabirimlerine açar. Şifreler .env.example'daki geliştirme varsayılanlarıdır.

services:
  aynesil-db:
    ports:
      - "5432:5432"

  aynesil-redis:
    ports:
      - "6379:6379"

  aynesil-api:
    ports: !override
      - "${API_PORT:-5000}:5000"

  aynesil-web:
    ports: !override
      - "${FRONTEND_PORT:-5173}:80"
